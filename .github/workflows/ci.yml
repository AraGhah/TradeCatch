name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The jobs only read the repository; nothing here needs to write to it.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tc003_staging
          POSTGRES_PASSWORD: billing-ci-not-for-production
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: No committed secrets
        run: npm run check:secrets

      - name: i18n parity
        run: npm run check:i18n

      - name: Legal placeholder check
        run: npm run check:legal

      - name: Media budget check
        run: npm run check:media

      - name: Dev audit exception expiry
        run: npm run check:dev-audit

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Cloudflare binding types are current
        run: npm run cf-typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (including PostgreSQL billing and notification recovery)
        run: |
          node scripts/prepare-ci-databases.js
          npm run test:unit
        env:
          STRIPE_BILLING_TEST_DATABASE_URL: postgresql://postgres:billing-ci-not-for-production@127.0.0.1:5432/tc003_staging
          NOTIFICATION_TEST_DATABASE_URL: postgresql://postgres:billing-ci-not-for-production@127.0.0.1:5432/tc003_staging
          BOOK_AUDIT_TEST_DATABASE_URL: postgresql://postgres:billing-ci-not-for-production@127.0.0.1:5432/tc002_staging
          LOGIN_CONFIRMATION_TEST_DATABASE_URL: postgresql://postgres:billing-ci-not-for-production@127.0.0.1:5432/tc006_staging

      - name: Quality assurance suite
        run: npm run test:qa

      - name: Audit production deps (high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Verify patched brace-expansion overrides
        run: node scripts/check-brace-expansion.js

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://tradecatch.ca

      - name: Build Cloudflare artifact
        run: npm run build:cloudflare
        env:
          NEXT_PUBLIC_SITE_URL: https://tradecatch.ca

      - name: Validate Cloudflare Worker bundle
        run: npm run check:cloudflare-bundle

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SITE_URL: https://tradecatch.ca
